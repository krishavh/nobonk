org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# ── Release signing (T-REL-SDK) ──────────────────────────────────────────────
# DO NOT put real keystore credentials in this committed file.
# Supply them in ~/.gradle/gradle.properties (outside the repo) or as env vars:
#   NOBONK_STORE_FILE=/absolute/path/to/nobonk-upload.jks
#   NOBONK_STORE_PASSWORD=********
#   NOBONK_KEY_ALIAS=nobonk-upload
#   NOBONK_KEY_PASSWORD=********
# When these are absent the app still builds; release artifacts are just unsigned.
# See docs/RELEASE_CHECKLIST.md for keystore generation.
