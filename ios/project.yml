name: NoBonk
options:
  bundleIdPrefix: ai.genwhy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  NoBonk:
    type: application
    platform: iOS
    sources:
      - path: NoBonk
        excludes: [Info.plist]
      - path: QuickAccess
    dependencies:
      - target: NoBonkControls
        embed: true
    info:
      path: NoBonk/Info.plist
      properties:
        CFBundleDisplayName: NoBonk
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: NoBonk uses the rear camera to detect people on this iPhone. Frames are processed locally and are never saved or uploaded.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.genwhy.nobonk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  NoBonkControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NoBonkControls
        excludes: [Info.plist]
      - path: QuickAccess
    info:
      path: NoBonkControls/Info.plist
      properties:
        CFBundleDisplayName: NoBonk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.genwhy.nobonk.controls
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
  NoBonkQuickAccessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuickAccessTests
    dependencies:
      - target: NoBonk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.genwhy.nobonk.quick-access-tests

schemes:
  NoBonk:
    build:
      targets:
        NoBonk: all
    test:
      targets:
        - NoBonkQuickAccessTests
