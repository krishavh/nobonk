name: NoBonk
options:
  bundleIdPrefix: ai.genwhy
  deploymentTarget:
    iOS: "17.0"
packages:
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "7"
    MARKETING_VERSION: "0.2.5"
targets:
  NoBonk:
    type: application
    platform: iOS
    sources:
      - path: NoBonk
        excludes: [Info.plist, Models]
      - path: NoBonk/Models
        type: folder
        buildPhase: resources
      - path: QuickAccess
    dependencies:
      - package: OnnxRuntime
        product: onnxruntime
      - target: NoBonkControls
        embed: true
    info:
      path: NoBonk/Info.plist
      properties:
        CFBundleDisplayName: NoBonk
        CFBundleShortVersionString: "0.2.5"
        CFBundleVersion: "7"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: NoBonk uses the rear camera to detect people and selected objects on this iPhone. Camera frames are processed locally and are never saved or uploaded.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.genwhy.nobonk
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  NoBonkControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: NoBonkControls
        excludes: [Info.plist]
      - path: QuickAccess
    info:
      path: NoBonkControls/Info.plist
      properties:
        CFBundleDisplayName: NoBonk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.genwhy.nobonk.controls
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
  NoBonkFastProbe:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NoBonk/Core
      - path: NoBonk/App/FastObjectDetector.swift
      - path: RuntimeValidation
    dependencies:
      - package: OnnxRuntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.genwhy.nobonk.fast-probe
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  NoBonkQuickAccessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QuickAccessTests
      - path: WebKitTests
        excludes: [README.md]
      - path: DeviceBenchmarks
        excludes: [README.md]
      - path: Tests/Fixtures/fast-graph-reference.json
        buildPhase: resources
    dependencies:
      - target: NoBonk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.genwhy.nobonk.quick-access-tests

schemes:
  NoBonk:
    build:
      targets:
        NoBonk: all
    test:
      targets:
        - NoBonkQuickAccessTests
