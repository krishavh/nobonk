name: NoBonkMessagesCameraLab
options:
  deploymentTarget:
    iOS: "18.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  NoBonkMessagesCameraLab:
    type: application
    platform: iOS
    sources: [Host, Shared]
    dependencies:
      - target: MessagesCameraExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.genwhy.nobonk.messageslab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: NoBonk Messages Lab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSCameraUsageDescription: The visible NoBonk Messages research panel uses the rear camera for on-device People detection. It saves no frames and does not access conversation content.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  MessagesCameraExtension:
    type: app-extension.messages
    platform: iOS
    sources: [Extension, Core, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.genwhy.nobonk.messageslab.extension
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: NoBonk Messages Lab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: The visible NoBonk Messages research panel uses the rear camera for on-device People detection. It saves no frames and does not access conversation content.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionMainStoryboard: MainInterface
schemes:
  NoBonkMessagesCameraLab:
    build:
      targets:
        NoBonkMessagesCameraLab: all
        MessagesCameraExtension: all
