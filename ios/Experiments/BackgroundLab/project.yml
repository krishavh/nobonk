name: NoBonkBackgroundLab
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NoBonkBackgroundLab:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.genwhy.nobonk.backgroundlab
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NoBonk Lab
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [ai.genwhy.nobonk.backgroundlab.analysis.*]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  NoBonkBackgroundLab:
    build:
      targets:
        NoBonkBackgroundLab: all
