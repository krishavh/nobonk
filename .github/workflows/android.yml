name: Android CI
on:
  push:
    branches: [main, fix/release-eng]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install verified detection models
        run: python scripts/install_verified_models.py
      - name: Unit tests + debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Release AAB (unsigned) + 16 KB alignment check
        run: |
          ./gradlew --no-daemon bundleRelease -Pbundle
          bash scripts/check_16kb_alignment.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nobonk-release-unsigned
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
